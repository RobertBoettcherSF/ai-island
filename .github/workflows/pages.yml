name: pages

# Turns GitHub Pages on for main /docs. The cloud-agent token cannot call
# this API; the workflow token can. A later run that finds the site already
# there (HTTP 409) is success.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml

permissions:
  administration: write
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-24.04
    steps:
      - name: Enable Pages from main /docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/docs"}}')
          echo "HTTP $code"
          cat /tmp/pages.json
          echo
          if [ "$code" = "201" ] || [ "$code" = "409" ]; then
            exit 0
          fi
          exit 1
