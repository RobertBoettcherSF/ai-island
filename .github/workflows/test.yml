name: test

on:
  push:
  pull_request:

jobs:
  gnat-12:
    name: GNAT 12.3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GNAT 12.3 and gprbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-12-base=12.3.0-17ubuntu1 \
            cpp-12=12.3.0-17ubuntu1 \
            gcc-12=12.3.0-17ubuntu1 \
            libgcc-12-dev=12.3.0-17ubuntu1 \
            libgnat-12=12.3.0-17ubuntu1 \
            gnat-12=12.3.0-17ubuntu1 \
            gprbuild
          gcc-12 --version
          if [ ! -x /usr/bin/gnatbind ]; then
            sudo ln -sf /usr/bin/gnatbind-12 /usr/local/bin/gnatbind
            sudo ln -sf /usr/bin/gnatlink-12 /usr/local/bin/gnatlink
          fi
          command -v gnatbind
      - name: Test
        run: make test ADA_DRIVER=gcc-12

  gnat-14:
    name: GNAT 14
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GNAT 14 and gprbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat-14 gprbuild
          gcc-14 --version
          if [ ! -x /usr/bin/gnatbind ]; then
            sudo ln -sf /usr/bin/gnatbind-14 /usr/local/bin/gnatbind
            sudo ln -sf /usr/bin/gnatlink-14 /usr/local/bin/gnatlink
          fi
          command -v gnatbind
      - name: Test
        run: make test ADA_DRIVER=gcc-14
